<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xbox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0c0f14;
      color: #f8fafc;
      overflow: hidden;
      user-select: none;
    }

    .xb-shell {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Barra lateral izquierda */
    .xb-sidebar {
      width: 168px;
      min-width: 138px;
      background: #12161f;
      border-right: 1px solid #222938;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .xb-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }

    .xb-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #107c10;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
    }

    .xb-nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .xb-nav-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
    }

    .xb-nav-btn.active {
      background: rgba(16, 124, 16, 0.24);
      color: #6ee7b7;
      font-weight: 600;
    }

    /* Área principal */
    .xb-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 75% 10%, rgba(16, 124, 16, 0.18), transparent 50%), #0c0f14;
      overflow: hidden;
    }

    /* Vista catálogo */
    .xb-catalog {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
    }

    .xb-hero {
      border-radius: 10px;
      padding: 16px 18px;
      background: linear-gradient(120deg, #107c10 0%, #0b3b16 60%, #151b26 100%);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }

    .xb-hero-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .xb-hero-sub {
      font-size: 12px;
      color: #dcfce7;
    }

    .xb-btn-green {
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      background: #107c10;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.14s ease, transform 0.1s ease;
    }

    .xb-btn-green:hover {
      background: #169616;
      transform: translateY(-1px);
    }

    .xb-btn-dark {
      padding: 6px 11px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .xb-btn-dark:hover {
      background: #334155;
    }

    .xb-section-title {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 10px;
    }

    .xb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 10px;
    }

    .xb-card {
      background: #151a24;
      border: 1px solid #252d3d;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }

    .xb-card:hover {
      transform: translateY(-2px);
      border-color: #22c55e;
    }

    .xb-card-art {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .xb-card-body {
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      justify-content: space-between;
    }

    .xb-card-name {
      font-size: 12.5px;
      font-weight: 700;
      color: #ffffff;
    }

    .xb-card-desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.35;
    }

    /* Vista de juego activo */
    .xb-player-view {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      padding: 10px 14px;
      gap: 8px;
    }

    .xb-player-view.active {
      display: flex;
    }

    .xb-player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .xb-player-stats {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .xb-canvas-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07090d;
      border: 1px solid #252d3d;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    #xb-canvas {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    .xb-touch-pad {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .xb-pad-btn {
      min-width: 44px;
      height: 32px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #182030;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .xb-pad-btn:active {
      background: #107c10;
    }
  </style>
</head>
<body>
  <div class="xb-shell">
    <aside class="xb-sidebar">
      <div class="xb-brand">
        <span class="xb-badge">X</span>
        <span>Xbox</span>
      </div>
      <button class="xb-nav-btn active" type="button" data-view="home">Inicio</button>
      <button class="xb-nav-btn" type="button" data-view="games">Juegos</button>
      <button class="xb-nav-btn" type="button" data-view="recent">Recientes</button>
    </aside>

    <main class="xb-main">
      <div id="xb-catalog" class="xb-catalog">
        <section class="xb-hero">
          <div>
            <div class="xb-hero-title">Juegos listos para jugar</div>
            <div class="xb-hero-sub">Usa teclado (Flechas / WASD / Espacio) o los botones en pantalla.</div>
          </div>
          <button id="xb-quick-play" class="xb-btn-green" type="button">Jugar Neon Snake</button>
        </section>

        <div id="xb-section-title" class="xb-section-title">Catálogo jugable</div>
        <div id="xb-grid" class="xb-grid"></div>
      </div>

      <section id="xb-player-view" class="xb-player-view" aria-hidden="true">
        <div class="xb-player-bar">
          <div style="display: flex; align-items: center; gap: 8px;">
            <button id="xb-back-btn" class="xb-btn-dark" type="button">← Catálogo</button>
            <span id="xb-active-title" style="font-size: 13px; font-weight: 700;">Juego</span>
          </div>
          <div class="xb-player-stats">
            <span id="xb-score">Puntos: 0</span>
            <span id="xb-best">Récord: 0</span>
            <button id="xb-restart-btn" class="xb-btn-green" type="button">Reiniciar</button>
          </div>
        </div>

        <div class="xb-canvas-wrap">
          <canvas id="xb-canvas" width="480" height="300"></canvas>
        </div>

        <div class="xb-touch-pad" aria-label="Controles del juego">
          <button class="xb-pad-btn" type="button" data-dir="left">◀</button>
          <button class="xb-pad-btn" type="button" data-dir="up">▲</button>
          <button class="xb-pad-btn" type="button" data-dir="down">▼</button>
          <button class="xb-pad-btn" type="button" data-dir="right">▶</button>
          <button class="xb-pad-btn" type="button" data-dir="action">ACCIÓN</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const GAMES = [
      {
        id: "snake",
        name: "Neon Snake",
        desc: "Come orbes brillantes y crece sin chocar.",
        bg: "linear-gradient(135deg, #065f46, #10b981)"
      },
      {
        id: "dodger",
        name: "Sky Dodger",
        desc: "Esquiva bloques que caen y suma puntos.",
        bg: "linear-gradient(135deg, #1d4ed8, #06b6d4)"
      },
      {
        id: "breaker",
        name: "Block Breaker",
        desc: "Destruye todos los bloques con la pelota.",
        bg: "linear-gradient(135deg, #7c2d12, #ea580c)"
      }
    ];

    const RECENTS_KEY = "win11_xbox_recents_v1";
    const BEST_KEY = "win11_xbox_best_v1";

    let recents = [];
    let bestScores = {};
    try {
      recents = JSON.parse(localStorage.getItem(RECENTS_KEY) || "[]");
      bestScores = JSON.parse(localStorage.getItem(BEST_KEY) || "{}");
    } catch {}

    function saveStats() {
      try {
        localStorage.setItem(RECENTS_KEY, JSON.stringify(recents));
        localStorage.setItem(BEST_KEY, JSON.stringify(bestScores));
      } catch {}
    }

    let currentNav = "home";
    let activeGameId = null;
    let score = 0;
    let gameOver = false;
    let rafId = null;
    let lastTick = 0;

    const canvas = document.getElementById("xb-canvas");
    const ctx = canvas.getContext("2d");
    const catalogEl = document.getElementById("xb-catalog");
    const playerViewEl = document.getElementById("xb-player-view");
    const activeTitleEl = document.getElementById("xb-active-title");
    const scoreEl = document.getElementById("xb-score");
    const bestEl = document.getElementById("xb-best");

    // Estado Snake
    const GRID = 20;
    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 10, y: 7 };

    // Estado Dodger
    let playerX = 220;
    let moveLeft = false;
    let moveRight = false;
    let obstacles = [];

    // Estado Breaker
    let paddleX = 195;
    let ball = { x: 240, y: 220, vx: 3.1, vy: -3.1, r: 7 };
    let bricks = [];

    function updateScoreUI() {
      const prevBest = bestScores[activeGameId] || 0;
      if (score > prevBest) {
        bestScores[activeGameId] = score;
        saveStats();
      }
      scoreEl.textContent = `Puntos: ${score}`;
      bestEl.textContent = `Récord: ${bestScores[activeGameId] || 0}`;
    }

    function spawnFood() {
      const cols = Math.floor(canvas.width / GRID);
      const rows = Math.floor(canvas.height / GRID);
      food = {
        x: Math.floor(Math.random() * cols),
        y: Math.floor(Math.random() * rows)
      };
    }

    function initBreakerBricks() {
      bricks = [];
      const colors = ["#ef4444", "#f59e0b", "#10b981", "#3b82f6"];
      const cols = 8;
      const rows = 4;
      const pad = 8;
      const w = (canvas.width - pad * (cols + 1)) / cols;
      const h = 16;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({
            x: pad + c * (w + pad),
            y: 28 + r * (h + 6),
            w,
            h,
            color: colors[r % colors.length],
            alive: true
          });
        }
      }
    }

    function resetGame() {
      score = 0;
      gameOver = false;
      lastTick = 0;

      if (activeGameId === "snake") {
        snake = [{ x: 8, y: 7 }, { x: 7, y: 7 }, { x: 6, y: 7 }];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        spawnFood();
      } else if (activeGameId === "dodger") {
        playerX = canvas.width / 2 - 22;
        obstacles = [];
      } else if (activeGameId === "breaker") {
        paddleX = canvas.width / 2 - 42;
        ball = { x: canvas.width / 2, y: canvas.height - 45, vx: 3.1, vy: -3.1, r: 7 };
        initBreakerBricks();
      }

      updateScoreUI();
    }

    function launchGame(gameId) {
      activeGameId = gameId;
      const meta = GAMES.find((g) => g.id === gameId);
      activeTitleEl.textContent = meta ? meta.name : "Juego";

      recents = [gameId, ...recents.filter((id) => id !== gameId)].slice(0, 6);
      saveStats();

      catalogEl.style.display = "none";
      playerViewEl.classList.add("active");
      playerViewEl.setAttribute("aria-hidden", "false");

      resetGame();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }

    function exitToCatalog() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      activeGameId = null;
      playerViewEl.classList.remove("active");
      playerViewEl.setAttribute("aria-hidden", "true");
      catalogEl.style.display = "block";
      renderCatalog();
    }

    function drawGameOverOverlay() {
      ctx.fillStyle = "rgba(7, 9, 13, 0.78)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 22px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 8);
      ctx.fillStyle = "#86efac";
      ctx.font = "13px Segoe UI, sans-serif";
      ctx.fillText("Pulsa Reiniciar o Espacio para jugar otra vez", canvas.width / 2, canvas.height / 2 + 18);
    }

    function stepSnake(now) {
      if (now - lastTick < 115) return;
      lastTick = now;

      dir = nextDir;
      const cols = Math.floor(canvas.width / GRID);
      const rows = Math.floor(canvas.height / GRID);
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      const hitWall = head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows;
      const hitSelf = snake.some((seg) => seg.x === head.x && seg.y === head.y);

      if (hitWall || hitSelf) {
        gameOver = true;
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        updateScoreUI();
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function renderSnake() {
      ctx.fillStyle = "#090c12";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      snake.forEach((seg, idx) => {
        ctx.fillStyle = idx === 0 ? "#4ade80" : "#16a34a";
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
      });
    }

    function stepDodger(now) {
      if (moveLeft) playerX -= 5.2;
      if (moveRight) playerX += 5.2;
      playerX = Math.max(4, Math.min(canvas.width - 48, playerX));

      if (now - lastTick > 680) {
        lastTick = now;
        const w = 28 + Math.floor(Math.random() * 26);
        obstacles.push({
          x: Math.random() * (canvas.width - w),
          y: -20,
          w,
          h: 18,
          speed: 2.6 + Math.min(3.5, score * 0.02)
        });
      }

      const playerY = canvas.height - 26;
      const playerW = 44;
      const playerH = 14;

      obstacles.forEach((obs) => {
        obs.y += obs.speed;
        const overlap =
          obs.x < playerX + playerW &&
          obs.x + obs.w > playerX &&
          obs.y < playerY + playerH &&
          obs.y + obs.h > playerY;
        if (overlap) {
          gameOver = true;
        }
      });

      const before = obstacles.length;
      obstacles = obstacles.filter((obs) => obs.y < canvas.height + 24);
      const passed = before - obstacles.length;
      if (passed > 0 && !gameOver) {
        score += passed * 5;
        updateScoreUI();
      }
    }

    function renderDodger() {
      ctx.fillStyle = "#090c12";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(playerX, canvas.height - 26, 44, 14);

      ctx.fillStyle = "#f43f5e";
      obstacles.forEach((obs) => {
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      });
    }

    function stepBreaker() {
      if (moveLeft) paddleX -= 6;
      if (moveRight) paddleX += 6;
      paddleX = Math.max(4, Math.min(canvas.width - 88, paddleX));

      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) ball.vx *= -1;
      if (ball.y - ball.r < 0) ball.vy *= -1;

      const paddleY = canvas.height - 22;
      if (
        ball.vy > 0 &&
        ball.y + ball.r >= paddleY &&
        ball.y - ball.r <= paddleY + 10 &&
        ball.x >= paddleX &&
        ball.x <= paddleX + 84
      ) {
        ball.vy = -Math.abs(ball.vy);
      }

      bricks.forEach((b) => {
        if (!b.alive) return;
        if (
          ball.x + ball.r > b.x &&
          ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y &&
          ball.y - ball.r < b.y + b.h
        ) {
          b.alive = false;
          ball.vy *= -1;
          score += 15;
          updateScoreUI();
        }
      });

      if (bricks.every((b) => !b.alive)) {
        initBreakerBricks();
      }

      if (ball.y - ball.r > canvas.height) {
        gameOver = true;
      }
    }

    function renderBreaker() {
      ctx.fillStyle = "#090c12";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      bricks.forEach((b) => {
        if (!b.alive) return;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });

      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(paddleX, canvas.height - 22, 84, 10);

      ctx.fillStyle = "#fbbf24";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop(now) {
      if (!activeGameId) return;

      if (!gameOver) {
        if (activeGameId === "snake") stepSnake(now);
        else if (activeGameId === "dodger") stepDodger(now);
        else if (activeGameId === "breaker") stepBreaker();
      }

      if (activeGameId === "snake") renderSnake();
      else if (activeGameId === "dodger") renderDodger();
      else if (activeGameId === "breaker") renderBreaker();

      if (gameOver) drawGameOverOverlay();

      rafId = requestAnimationFrame(loop);
    }

    function applyDirection(d) {
      if (d === "left") {
        moveLeft = true;
        moveRight = false;
        if (activeGameId === "snake" && dir.x !== 1) nextDir = { x: -1, y: 0 };
      } else if (d === "right") {
        moveRight = true;
        moveLeft = false;
        if (activeGameId === "snake" && dir.x !== -1) nextDir = { x: 1, y: 0 };
      } else if (d === "up") {
        if (activeGameId === "snake" && dir.y !== 1) nextDir = { x: 0, y: -1 };
      } else if (d === "down") {
        if (activeGameId === "snake" && dir.y !== -1) nextDir = { x: 0, y: 1 };
      } else if (d === "action" && gameOver) {
        resetGame();
      }
    }

    document.querySelectorAll(".xb-pad-btn[data-dir]").forEach((btn) => {
      const d = btn.dataset.dir;
      btn.addEventListener("pointerdown", () => applyDirection(d));
      btn.addEventListener("pointerup", () => {
        if (d === "left") moveLeft = false;
        if (d === "right") moveRight = false;
      });
      btn.addEventListener("pointerleave", () => {
        if (d === "left") moveLeft = false;
        if (d === "right") moveRight = false;
      });
    });

    window.addEventListener("keydown", (e) => {
      if (!activeGameId) return;
      if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") applyDirection("left");
      else if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") applyDirection("right");
      else if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") applyDirection("up");
      else if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") applyDirection("down");
      else if ((e.key === " " || e.key === "Enter") && gameOver) {
        e.preventDefault();
        resetGame();
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") moveLeft = false;
      if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") moveRight = false;
    });

    function renderCatalog() {
      const titleEl = document.getElementById("xb-section-title");
      const gridEl = document.getElementById("xb-grid");

      let list = GAMES;
      if (currentNav === "recent") {
        titleEl.textContent = "Jugados recientemente";
        list = recents.map((id) => GAMES.find((g) => g.id === id)).filter(Boolean);
      } else if (currentNav === "games") {
        titleEl.textContent = "Todos los juegos";
      } else {
        titleEl.textContent = "Catálogo jugable";
      }

      if (list.length === 0) {
        gridEl.innerHTML = `<div style="font-size:12px;color:#94a3b8;padding:14px;">Aún no jugaste ninguna partida. Elige un juego para empezar.</div>`;
        return;
      }

      gridEl.innerHTML = "";
      list.forEach((g) => {
        const card = document.createElement("div");
        card.className = "xb-card";
        const best = bestScores[g.id] || 0;
        card.innerHTML = `
          <div class="xb-card-art" style="background:${g.bg};">${g.name}</div>
          <div class="xb-card-body">
            <div>
              <div class="xb-card-name">${g.name}</div>
              <div class="xb-card-desc">${g.desc}</div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
              <span style="font-size:10.5px;color:#86efac;">Récord: ${best}</span>
              <button class="xb-btn-green" type="button">Jugar</button>
            </div>
          </div>
        `;
        card.querySelector("button").addEventListener("click", () => launchGame(g.id));
        gridEl.appendChild(card);
      });
    }

    document.querySelectorAll(".xb-nav-btn[data-view]").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentNav = btn.dataset.view;
        document.querySelectorAll(".xb-nav-btn[data-view]").forEach((b) => {
          b.classList.toggle("active", b === btn);
        });
        if (activeGameId) exitToCatalog();
        else renderCatalog();
      });
    });

    document.getElementById("xb-quick-play").addEventListener("click", () => launchGame("snake"));
    document.getElementById("xb-back-btn").addEventListener("click", exitToCatalog);
    document.getElementById("xb-restart-btn").addEventListener("click", resetGame);

    renderCatalog();
  </script>
</body>
</html>
