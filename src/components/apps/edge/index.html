<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft Edge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      overflow: hidden;
      user-select: none;
    }

    .edge-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* Barra superior de pestaña / título interno */
    .edge-tabbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px 0;
      background: #e2e8f0;
      border-bottom: 1px solid #cbd5e1;
    }

    .edge-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 220px;
      padding: 6px 12px;
      border-radius: 8px 8px 0 0;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-bottom: none;
      font-size: 12px;
      font-weight: 500;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Barra de direcciones y controles */
    .edge-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .edge-nav-btn {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: #334155;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease;
      flex-shrink: 0;
    }

    .edge-nav-btn:hover:not(:disabled) {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }

    .edge-nav-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .edge-address-form {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 4px 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .edge-address-form:focus-within {
      border-color: #0067c0;
      box-shadow: 0 0 0 2px rgba(0, 103, 192, 0.16);
    }

    .edge-lock-icon {
      font-size: 11px;
      color: #475569;
    }

    #url-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 12px;
      color: #0f172a;
      font-family: inherit;
      user-select: text;
    }

    .edge-go-btn {
      border: none;
      background: #0067c0;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.14s ease;
    }

    .edge-go-btn:hover {
      background: #00559f;
    }

    /* Barra de favoritos / accesos rápidos */
    .edge-bookmarks {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      overflow-x: auto;
    }

    .edge-bookmark-btn {
      border: 1px solid transparent;
      background: transparent;
      color: #334155;
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.14s ease, border-color 0.14s ease;
    }

    .edge-bookmark-btn:hover {
      background: #ffffff;
      border-color: #cbd5e1;
    }

    /* Área del iframe anidado */
    .edge-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    #edge-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    .edge-statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 12px;
      background: #f1f5f9;
      border-top: 1px solid #e2e8f0;
      font-size: 11px;
      color: #475569;
    }

    .edge-status-url {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="edge-shell">
    <!-- Pestaña -->
    <div class="edge-tabbar">
      <div class="edge-tab">
        <span>🌐</span>
        <span id="tab-title">Nueva pestaña</span>
      </div>
    </div>

    <!-- Controles de navegación y barra de URL -->
    <div class="edge-toolbar">
      <button id="btn-back" class="edge-nav-btn" type="button" title="Atrás" disabled>←</button>
      <button id="btn-forward" class="edge-nav-btn" type="button" title="Adelante" disabled>→</button>
      <button id="btn-reload" class="edge-nav-btn" type="button" title="Recargar">↻</button>
      <button id="btn-home" class="edge-nav-btn" type="button" title="Inicio">⌂</button>

      <form id="url-form" class="edge-address-form">
        <span class="edge-lock-icon">🔒</span>
        <input id="url-input" type="text" placeholder="Escribe una URL (ej. https://example.com) o busca..." autocomplete="off">
        <button class="edge-go-btn" type="submit">Ir</button>
      </form>
    </div>

    <!-- Accesos rápidos -->
    <div class="edge-bookmarks">
      <button class="edge-bookmark-btn" type="button" data-url="https://example.com">Example.com</button>
      <button class="edge-bookmark-btn" type="button" data-url="https://es.wikipedia.org">Wikipedia</button>
      <button class="edge-bookmark-btn" type="button" data-url="https://developer.mozilla.org">MDN Web Docs</button>
      <button class="edge-bookmark-btn" type="button" data-url="https://html.spec.whatwg.org">HTML Spec</button>
    </div>

    <!-- Iframe dentro del iframe -->
    <div class="edge-viewport">
      <iframe
        id="edge-iframe"
        src="https://example.com"
        title="Navegador Edge"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
      ></iframe>
    </div>

    <!-- Barra de estado -->
    <div class="edge-statusbar">
      <span id="status-url" class="edge-status-url">https://example.com</span>
      <span id="status-note">Iframe anidado activo</span>
    </div>
  </div>

  <script>
    const HOME_URL = "https://example.com";

    const iframeEl = document.getElementById("edge-iframe");
    const urlForm = document.getElementById("url-form");
    const urlInput = document.getElementById("url-input");
    const tabTitleEl = document.getElementById("tab-title");
    const statusUrlEl = document.getElementById("status-url");
    const statusNoteEl = document.getElementById("status-note");
    const btnBack = document.getElementById("btn-back");
    const btnForward = document.getElementById("btn-forward");
    const btnReload = document.getElementById("btn-reload");
    const btnHome = document.getElementById("btn-home");

    let navHistory = [HOME_URL];
    let navIndex = 0;

    function normalizeAddress(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return HOME_URL;

      if (/^https?:\/\//i.test(trimmed)) {
        return trimmed;
      }

      if (trimmed.includes(".") && !trimmed.includes(" ")) {
        return `https://${trimmed}`;
      }

      return `https://www.bing.com/search?q=${encodeURIComponent(trimmed)}`;
    }

    function updateNavButtons() {
      btnBack.disabled = navIndex <= 0;
      btnForward.disabled = navIndex >= navHistory.length - 1;
    }

    function navigate(rawUrl, recordHistory = true) {
      const targetUrl = normalizeAddress(rawUrl);
      urlInput.value = targetUrl;
      statusUrlEl.textContent = targetUrl;
      statusNoteEl.textContent = "Cargando...";

      try {
        const parsed = new URL(targetUrl);
        tabTitleEl.textContent = parsed.hostname;
      } catch {
        tabTitleEl.textContent = targetUrl;
      }

      if (recordHistory) {
        navHistory = navHistory.slice(0, navIndex + 1);
        navHistory.push(targetUrl);
        navIndex = navHistory.length - 1;
      }

      updateNavButtons();
      iframeEl.src = targetUrl;
    }

    urlForm.addEventListener("submit", (e) => {
      e.preventDefault();
      navigate(urlInput.value, true);
    });

    btnBack.addEventListener("click", () => {
      if (navIndex > 0) {
        navIndex -= 1;
        navigate(navHistory[navIndex], false);
      }
    });

    btnForward.addEventListener("click", () => {
      if (navIndex < navHistory.length - 1) {
        navIndex += 1;
        navigate(navHistory[navIndex], false);
      }
    });

    btnReload.addEventListener("click", () => {
      statusNoteEl.textContent = "Recargando...";
      iframeEl.src = navHistory[navIndex] || HOME_URL;
    });

    btnHome.addEventListener("click", () => {
      navigate(HOME_URL, true);
    });

    document.querySelectorAll(".edge-bookmark-btn[data-url]").forEach((btn) => {
      btn.addEventListener("click", () => {
        navigate(btn.dataset.url, true);
      });
    });

    iframeEl.addEventListener("load", () => {
      statusNoteEl.textContent = "Listo (si un sitio bloquea iframes, prueba otro)";
    });

    // Estado inicial
    urlInput.value = HOME_URL;
    updateNavButtons();
  </script>
</body>
</html>
